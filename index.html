    <script>
        let wallets = JSON.parse(localStorage.getItem('myWalletsData')) || [];
        let currentWalletId = localStorage.getItem('currentWalletId') || null;

        function saveData() { localStorage.setItem('myWalletsData', JSON.stringify(wallets)); localStorage.setItem('currentWalletId', currentWalletId); }
        const fmt = (num) => new Intl.NumberFormat('ar-EG').format(num);

        function openModal(id) { const overlay = document.getElementById('modalOverlay'); const modal = document.getElementById(id); overlay.classList.remove('hidden', 'overlay-exit', 'overlay-exit-active'); modal.classList.remove('hidden', 'modal-exit', 'modal-exit-active'); void overlay.offsetWidth; overlay.classList.add('overlay-enter', 'overlay-enter-active'); modal.classList.add('modal-enter', 'modal-enter-active'); setTimeout(() => { overlay.classList.remove('overlay-enter'); modal.classList.remove('modal-enter'); }, 10); }
        function closeModal(id) { const overlay = document.getElementById('modalOverlay'); const modal = document.getElementById(id); overlay.classList.add('overlay-exit', 'overlay-exit-active'); modal.classList.add('modal-exit', 'modal-exit-active'); setTimeout(() => { overlay.classList.add('hidden'); modal.classList.add('hidden'); overlay.classList.remove('overlay-exit', 'overlay-exit-active', 'overlay-enter-active'); modal.classList.remove('modal-exit', 'modal-exit-active', 'modal-enter-active'); }, 200); }
        function closeAllModals() { ['newWalletModal', 'expenseModal', 'incomeModal'].forEach(id => { if(!document.getElementById(id).classList.contains('hidden')) closeModal(id); }); }

        function handleCreateWallet() { const name = document.getElementById('walletNameInp').value.trim(); const amount = parseFloat(document.getElementById('walletAmountInp').value); if (!name || isNaN(amount)) return alert('بيانات غير صحيحة'); const newWallet = { id: Date.now().toString(), name: name, baseAmount: amount, transactions: [] }; wallets.push(newWallet); currentWalletId = newWallet.id; saveData(); closeModal('newWalletModal'); updateUI(); }
        function selectWallet(id) { currentWalletId = id; saveData(); updateUI(); }
        function handleAddTransaction(type) { const amt = parseFloat(document.getElementById(type === 'expense' ? 'expAmountInp' : 'incAmountInp').value); const desc = document.getElementById(type === 'expense' ? 'expDescInp' : 'incDescInp').value.trim(); if(isNaN(amt) || !desc) return; const w = wallets.find(w => w.id === currentWalletId); w.transactions.push({ id: Date.now().toString(), type, amount: amt, desc, date: new Date() }); saveData(); closeModal(type === 'expense' ? 'expenseModal' : 'incomeModal'); updateUI(); }
        function deleteTransaction(transId) { const w = wallets.find(w => w.id === currentWalletId); w.transactions = w.transactions.filter(t => t.id !== transId); saveData(); updateUI(); }

        function exportToWhatsApp() { const w = wallets.find(w => w.id === currentWalletId); if (!w) return; const total = w.transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0) + w.baseAmount - w.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0); let msg = `تقرير ${w.name}: الرصيد المتبقي ${fmt(total)} ج.م`; window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank'); }
        function exportToPDF() { const w = wallets.find(w => w.id === currentWalletId); if(!w) return; const div = document.createElement('div'); div.innerHTML = `<h1 style="text-align:center">${w.name}</h1><p>الرصيد المتبقي: ${fmt(w.baseAmount + w.transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0) - w.transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0))} ج.م</p>`; document.body.appendChild(div); html2pdf().from(div).save().then(() => document.body.removeChild(div)); }

        function updateUI() {
            const emptyState = document.getElementById('emptyState'); const walletView = document.getElementById('walletView'); const tabsContainer = document.getElementById('walletsTabs');
            if (wallets.length === 0) { emptyState.classList.remove('hidden'); walletView.classList.add('hidden'); return; }
            emptyState.classList.add('hidden'); walletView.classList.remove('hidden'); tabsContainer.innerHTML = '';
            wallets.forEach(w => { const btn = document.createElement('button'); btn.onclick = () => selectWallet(w.id); btn.className = `whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-bold ${w.id === currentWalletId ? 'bg-gold text-dark' : 'bg-card text-slate-400 border border-slate-700'}`; btn.textContent = w.name; tabsContainer.appendChild(btn); });
            if(!currentWalletId && wallets.length > 0) currentWalletId = wallets[0].id;
            const w = wallets.find(w => w.id === currentWalletId);
            if(!w) return;
            const inc = w.transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const exp = w.transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            document.getElementById('cardRemaining').textContent = fmt(w.baseAmount + inc - exp);
            document.getElementById('cardTotal').textContent = fmt(w.baseAmount + inc) + ' ج.م';
            document.getElementById('cardSpent').textContent = fmt(exp) + ' ج.م';
            const list = document.getElementById('transactionsList'); list.innerHTML = '';
            w.transactions.slice().reverse().forEach(t => {
                const li = document.createElement('li'); li.className = 'bg-card border border-slate-700/50 p-4 rounded-2xl flex justify-between';
                li.innerHTML = `<div><p class="font-bold text-slate-200">${t.desc}</p></div><div class="flex gap-4"><p class="font-bold ${t.type === 'expense' ? 'text-red-400' : 'text-green-400'}">${t.type === 'expense' ? '-' : '+'}${fmt(t.amount)}</p><button onclick="deleteTransaction('${t.id}')" class="text-slate-600">×</button></div>`;
                list.appendChild(li);
            });
            document.getElementById('transCount').textContent = w.transactions.length + ' عملية';
        }
        updateUI();
    </script>
